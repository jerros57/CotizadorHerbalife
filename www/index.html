<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Con MultiCy 2026</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --verde:#2e8b57; --verde-osc:#1b5e20; --verde-claro:#e3f1e6;
  --fondo:#f4fce3; --texto:#1c2024; --gris:#6b7680; --borde:#dfe5e9;
}
*{ box-sizing:border-box; }
body { font-family: 'Segoe UI', Roboto, sans-serif; padding: 14px 14px 40px 14px; background: var(--fondo); color: var(--texto); margin: 0; }
.wrap{ max-width:560px; margin:0 auto; }

/* Encabezado */
.header { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 16px; }
.header-title-box { display: flex; align-items: center; gap: 12px; }
.header-title-box img { width: 40px; height: 40px; border-radius: 10px; object-fit: contain; flex-shrink: 0; }
.header-title-box h1 { margin: 0; font-size: 21px; font-weight: 700; line-height: 1.2; }
.save-btn { font-size: 26px; cursor: pointer; width:46px; height:46px; display:flex; align-items:center; justify-content:center; background:#fff; border:1px solid var(--borde); border-radius:50%; }
.save-btn img{ width:28px; height:28px; object-fit:contain; }
.save-btn:active{ transform:scale(.92); }

/* Historial */
.historial { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 14px 0; }
.historial:empty{ display:none; }
.hist-item {
  width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
  background: #fff; border: 2px solid var(--verde); border-radius: 14px;
  font-size: 19px; font-weight: bold; color: var(--verde); cursor: pointer;
}
.hist-item.active { background: var(--verde); color: white; }

/* Tarjeta de nivel */
.card { background:#fff; border:1px solid var(--borde); border-radius:26px; padding:18px 20px; box-shadow:0 2px 10px rgba(20,40,60,.05); }
.nivel-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.nivel-top h2{ margin:0; font-size:20px; font-weight:700; }
.badge-nivel{ background:var(--verde-claro); color:var(--verde); font-weight:700; padding:8px 16px; border-radius:14px; font-size:16px; }
.campo{ position:relative; }
.campo label{ position:absolute; top:-9px; left:16px; background:#fff; padding:0 6px; font-size:12px; color:var(--gris); }
select { width:100%; padding: 16px 18px; border-radius: 18px; border: 1px solid var(--borde); font-weight: 600; font-size:17px; background: #fff; color:var(--texto); }

/* Categorías */
h3.categoria { color: var(--verde); font-size:15px; letter-spacing:.3px; margin: 24px 4px 12px; text-transform:uppercase; }

/* Tarjetas de producto */
.lista-prod{ display:flex; flex-direction:column; gap:12px; }
.card-prod{ display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--borde); border-radius:22px; padding:12px 14px; box-shadow:0 2px 8px rgba(20,40,60,.04); }
.card-prod.activo{ border-color:var(--verde); }
.thumb{ width:62px; height:72px; flex-shrink:0; border-radius:14px; background:var(--verde-claro); display:flex; align-items:center; justify-content:center; overflow:hidden; }
.thumb img{ width:100%; height:100%; object-fit:contain; }
.info{ flex:1; min-width:0; }
.chip{ display:inline-block; background:var(--verde-claro); color:var(--verde); font-weight:600; font-size:12px; padding:3px 10px; border-radius:8px; }
.nom{ font-size:16.5px; font-weight:700; margin:5px 0 3px; line-height:1.2; }
.precio{ display:flex; align-items:baseline; gap:8px; }
.precio b{ color:var(--verde); font-size:19px; }
.precio span{ color:var(--gris); font-size:13px; font-weight:600; }
.qty{ display:flex; align-items:center; gap:8px; }
.qty .num{ min-width:22px; text-align:center; font-size:19px; font-weight:700; }
.btn-q{ width:36px; height:36px; padding:0; border-radius:50%; background:#fff; font-size:24px; line-height:1; display:flex; align-items:center; justify-content:center; }
.btn-q.minus{ border:2px solid #b4bcc3; color:#b4bcc3; }
.btn-q.plus{ border:2px solid var(--verde); color:var(--verde); }
.btn-q:active{ transform:scale(.9); }

/* Cotización actual */
.card h3{ margin:0 0 8px; font-size:18px; }

/* Resumen fijo abajo */
.resumen{ border-top:2px dashed var(--borde); margin-top:14px; padding-top:14px; }
#lista-ticket { list-style: none; padding: 0; margin: 0; font-size: 14px;}
.item-ticket { display: flex; justify-content: space-between; border-bottom: 1px dotted #ccc; padding: 8px 0;}
.resumen-in{ max-width:560px; margin:0 auto; }
.resumen h4{ margin:0 0 10px; font-size:19px; }
.fila{ display:flex; justify-content:space-between; font-size:16px; margin:7px 0; }
.fila.muted{ color:var(--gris); font-weight:600; }
.linea{ border-top:1px solid var(--borde); margin:10px 0; }
.fila.total{ align-items:center; font-size:26px; font-weight:800; margin:6px 0 14px; }
.fila.total span:last-child{ color:var(--verde); }
.botones{ display:flex; gap:12px; }
button { border: none; font-weight: 700; font-size: 16px; cursor: pointer; font-family:inherit; }
.btn-compartir, .btn-limpiar{ flex:1; padding:15px 10px; border-radius:20px; }
.btn-compartir { background: #25D366; color: white; flex:1.3; }
.btn-limpiar { background: #fff; color: var(--texto); border:1px solid var(--borde); }
</style>
</head>
<body>
<div class="wrap">

<div class="header">
  <div class="header-title-box">
    <img src="img/logo.png" alt="MultiCy Logo">
    <h1>Con MultiCy 2026</h1>
  </div>
  <span class="save-btn" onclick="guardarCotizacionActual()"><img src="img/cache.png" alt="Guardar" onerror="this.replaceWith(document.createTextNode('💾'))"></span>
</div>

<div id="historial" class="historial"></div>

<div class="card">
  <div class="nivel-top">
    <h2>Nivel / descuento</h2>
    <span class="badge-nivel" id="badge-nivel">PVP</span>
  </div>
  <div class="campo">
    <label for="nivel-precio">Nivel predefinido</label>
    <select id="nivel-precio" onchange="actualizarTicket()">
      <option value="0">💰 PVP</option>
      <option value="1">🏷️ 15%</option>
      <option value="2">🏷️ 25%</option>
      <option value="3">🏷️ 35%</option>
      <option value="4">🏷️ 42%</option>
      <option value="5">💎 50%</option>
    </select>
  </div>
</div>

<h3 class="categoria">Nutrición Interna</h3>
<div class="lista-prod" id="cat-interna"></div>

<h3 class="categoria">Nutrición Externa</h3>
<div class="lista-prod" id="cat-externa"></div>


<div class="card" style="margin-top:24px;">
  <h3>🧾 Cotización Actual</h3>
  <ul id="lista-ticket">
    <li style='text-align:center; color:#888;'>Toca los productos arriba para agregarlos</li>
  </ul>

<!-- Resumen -->
<div class="resumen">
  <div class="resumen-in">
    <h4>Resumen</h4>
    <div class="fila"><span>Nivel</span><span id="resumen-nivel">PVP</span></div>
    <div class="linea"></div>
    <div class="fila muted"><span>Puntos totales</span><span><span id="total-puntos">0.00</span> VP</span></div>
    <div class="fila total"><span>TOTAL</span><span>$<span id="total">0.00</span></span></div>
    <div class="botones">
      <button class="btn-limpiar" onclick="limpiar()">🗑️ Limpiar Todo</button>
      <button class="btn-compartir" onclick="compartirWhatsApp()">📲 Enviar por WhatsApp</button>
    </div>
  </div>
</div>
</div>

</div>

<script>
const productos = [
{n:"Aloe Concentrado", p:[55.00,47.73,42.87,38.02,34.62,30.74], pts:26.85},
{n:"Barras Proteína", p:[42.73,39.22,36.87,34.52,32.88,31.00], pts:16.15},
{n:"Batido F1", p:[57.87,50.21,45.11,40.01,36.43,32.35], pts:25.75},
{n:"Betahearth", p:[63.15,55.08,49.69,44.31,40.55,36.24], pts:27.00},
{n:"Beverage Mix", p:[50.08,44.07,40.05,36.04,33.24,30.03], pts:23.00},
{n:"Colágeno", p:[61.99,54.07,48.80,43.53,39.83,35.62], pts:27.80},
{n:"CR7 Drive", p:[41.76,36.74,33.39,30.04,27.70,25.02], pts:26.75},
{n:"Fibra Activa", p:[53.50,46.42,41.70,36.98,33.67,29.90], pts:24.65},
{n:"Golden Beverage", p:[35.51,31.05,28.08,25.11,23.03,20.65], pts:15.00},
{n:"Herbalifeline", p:[53.80,46.68,41.93,37.19,33.86,30.07], pts:27.70},
{n:"Immunity Essentials", p:[43.30,37.85,34.21,30.58,28.03,25.13], pts:18.75},
{n:"Liftoff Sobres", p:[108.41,94.07,84.50,74.94,68.24,60.59], pts:51.45},
{n:"Memory Armor", p:[44.00,38.39,34.65,30.91,28.29,25.30], pts:21.70},
{n:"Multivitamínico", p:[24.16,20.96,18.83,16.70,15.21,13.50], pts:10.75},
{n:"Niteworks", p:[68.39,59.89,54.22,48.55,44.58,40.04], pts:36.75},
{n:"Té N-R-G", p:[28.43,24.67,22.16,19.65,17.89,15.89], pts:15.85},
{n:"Nutri Soup", p:[42.04,36.67,33.08,29.49,26.98,24.12], pts:18.35},
{n:"Nutri Muffin", p:[46.04,39.95,35.88,31.82,28.98,25.73], pts:20.50},
{n:"PDM Crema de Maní", p:[74.70,64.63,58.34,52.04,47.64,42.60], pts:33.10},
{n:"PPP", p:[42.12,36.55,32.84,29.12,26.52,23.55], pts:19.30},
{n:"Probiotics", p:[46.26,40.14,36.06,31.98,29.12,25.86], pts:22.00},
{n:"Rebuild H24", p:[92.78,83.43,77.20,70.96,66.60,61.61], pts:39.20},
{n:"Relaxation Tea", p:[53.88,47.16,42.68,38.20,35.06,31.48], pts:24.54},
{n:"Té 100gr", p:[67.42,58.50,52.56,46.61,42.44,37.69], pts:37.60},
{n:"Té Chai", p:[38.66,33.55,30.14,26.72,24.34,21.61], pts:21.45},
{n:"Xtra-Cal", p:[24.16,20.96,18.83,16.70,15.21,13.50], pts:11.00},
{n:"Night Mode", p:[38.66,33.62,31.42,28.52,26.42,24.17], pts:16.85},
{n:"Crema Humectante", p:[63.11,54.76,49.19,43.62,39.73,35.27], pts:30.55},
{n:"Gel Refrescante", p:[19.38,16.81,15.10,13.39,12.20,10.83], pts:8.90},
{n:"Herbal Aloe Crema", p:[19.38,16.81,15.10,13.39,12.20,10.83], pts:8.90},
{n:"Skin Exfoliante", p:[29.13,25.27,22.70,20.13,18.33,16.28], pts:14.10},
{n:"Skin Limpiador", p:[37.21,32.29,29.01,25.72,23.42,20.80], pts:18.00},
{n:"Skin Mascarilla", p:[31.61,27.43,24.64,21.85,19.90,17.67], pts:15.25},
{n:"Skin Serum", p:[83.80,72.71,65.32,57.92,52.75,46.83], pts:40.55},
{n:"Skin Tonificador", p:[28.22,24.49,22.00,19.51,17.76,15.77], pts:13.65},
{n:"Creatina H24", p:[28.08,24.49,22.09,19.70,18.03,16.12], pts:12.05}
];

// Nombre visible e imagen de cada producto (mismo orden que "productos")
const visual = [
["Aloe Concentrado","aloe"],["Barras de Proteína","barras"],["Batidos Nutricional F1","batido"],["Betahearth","betahearth"],
["Beverage Mix","beverage"],["Colágeno","colageno"],["CR7 Drive","cr7"],["Fibra Manzana/Guayaba","fibra"],
["Golden Beverage","golden"],["Herbalifeline","herbalifeline"],["Immunity Essentials","immunity"],["Liftoff Polvo Sobres","liftoff"],
["Memory Armor","memory"],["Multivitamínico F2","multivitaminico"],["Niteworks","niteworks"],["Té N-R-G","nrg"],
["Nutri Soup","nutrisoup"],["Nutri Muffin","nutrimuffin"],["PDM Crema de Maní","pdm"],["PPP","ppp"],
["Probiotics","probiotics"],["Rebuild H24","rebuild"],["Relaxation Tea","relaxation"],["Té 100gr","te100"],
["Té Chai","techai"],["Xtra-Cal (Calcio)","xtracal"],["Night Mode","nightmode"],
["Crema Humectante Día","cremadia"],["Gel Refrescante Corporal","gelcorporal"],["Herbal Aloe Crema","aloecrema"],
["Skin Exfoliante","skinexfoliante"],["Skin Limpiador Cítrico","skinlimpiador"],["Skin Mascarilla Arcilla","skinmascarilla"],
["Skin Serum","skinserum"],["Skin Tonificador Hierbas","skintonificador"],
["Creatina H24","creatina"]
];

// Orden en pantalla
const ordenInterna = [...Array(27).keys(), 35];   // 0..26 y Creatina
const ordenExterna = [27,28,29,30,31,32,33,34];

function crearTarjeta(i, categoria) {
  return `<div class="card-prod" id="row-${i}">
    <div class="thumb"><img src="img/${visual[i][1]}.png" alt="" onerror="this.style.visibility='hidden'"></div>
    <div class="info">
      <span class="chip">${categoria}</span>
      <div class="nom">${visual[i][0]}</div>
      <div class="precio"><b id="precio-${i}">$0.00</b><span>${productos[i].pts.toFixed(2)} VP</span></div>
    </div>
    <div class="qty">
      <button class="btn-q minus" onclick="quitar(${i})">−</button>
      <span class="num" id="cont-${i}">0</span>
      <button class="btn-q plus" onclick="agregar(${i})">+</button>
    </div>
  </div>`;
}

document.getElementById('cat-interna').innerHTML = ordenInterna.map(i => crearTarjeta(i, 'Nutrición interna')).join('');
document.getElementById('cat-externa').innerHTML = ordenExterna.map(i => crearTarjeta(i, 'Nutrición Externa')).join('');

let carrito = [];
let cotizacionesGuardadas = JSON.parse(localStorage.getItem('cotizacionesHerbalife')) || [];
let cotizacionActualIndex = -1;

function agregar(i) {
carrito.push(productos[i]);
actualizarContador(i);
actualizarTicket();
}

function quitar(i) {
let idx = carrito.findIndex(p => p.n === productos[i].n);
if (idx === -1) return; // no hay nada que quitar
carrito.splice(idx, 1);
actualizarContador(i);
actualizarTicket();
}

function actualizarContador(i) {
let cantidad = carrito.filter(p => p.n === productos[i].n).length;
let el = document.getElementById('cont-' + i);
let row = document.getElementById('row-' + i);
if (el) el.textContent = cantidad;
if (row) row.classList.toggle('activo', cantidad > 0);
}

function actualizarContadorForAll() {
for (let i = 0; i < productos.length; i++) actualizarContador(i);
}

function actualizarTicket() {
let sel = document.getElementById('nivel-precio');
let niv = parseInt(sel.value);
let etiqueta = sel.options[niv].text.replace(/^[^\w]+/u, '').trim();
document.getElementById('badge-nivel').textContent = etiqueta;
document.getElementById('resumen-nivel').textContent = etiqueta;

// precios visibles en cada tarjeta según el nivel
productos.forEach((p, i) => {
  let el = document.getElementById('precio-' + i);
  if (el) el.textContent = '$' + p.p[niv].toFixed(2);
});

let total = 0, ptsTotal = 0, html = "";
carrito.forEach(p => {
let precio = p.p[niv];
total += precio;
ptsTotal += p.pts || 0;
html += `<li class="item-ticket"><span>${p.n}</span><b>$${precio.toFixed(2)}</b></li>`;
});
document.getElementById('lista-ticket').innerHTML = carrito.length === 0
? `<li style='text-align:center; color:#888;'>Toca los productos arriba para agregarlos</li>`
: html;
document.getElementById('total').textContent = total.toFixed(2);
document.getElementById('total-puntos').textContent = ptsTotal.toFixed(2);
}

function guardarCotizacionActual() {
if (carrito.length === 0) return alert("Agrega productos primero");
if (cotizacionActualIndex === -1 && cotizacionesGuardadas.length >= 5) {
return alert("Ya tienes 5 cotizaciones. Borra una primero.");
}
const cot = { items: JSON.parse(JSON.stringify(carrito)) };
if (cotizacionActualIndex >= 0) cotizacionesGuardadas[cotizacionActualIndex] = cot;
else {
cotizacionesGuardadas.push(cot);
cotizacionActualIndex = cotizacionesGuardadas.length - 1;
}
localStorage.setItem('cotizacionesHerbalife', JSON.stringify(cotizacionesGuardadas));
actualizarHistorial();
}

function actualizarHistorial() {
const cont = document.getElementById('historial');
cont.innerHTML = '';
cotizacionesGuardadas.forEach((_, i) => {
const div = document.createElement('div');
div.className = `hist-item ${i === cotizacionActualIndex ? 'active' : ''}`;
div.textContent = i + 1;
div.onclick = () => cargarCotizacion(i);
cont.appendChild(div);
});
}

function cargarCotizacion(i) {
cotizacionActualIndex = i;
carrito = JSON.parse(JSON.stringify(cotizacionesGuardadas[i].items));
actualizarContadorForAll();
actualizarTicket();
actualizarHistorial();
}

function limpiar() {
if (cotizacionActualIndex >= 0) {
cotizacionesGuardadas.splice(cotizacionActualIndex, 1);
localStorage.setItem('cotizacionesHerbalife', JSON.stringify(cotizacionesGuardadas));
cotizacionActualIndex = -1;
}
carrito = [];
actualizarContadorForAll();
actualizarTicket();
actualizarHistorial();
}

function compartirWhatsApp() {
if (carrito.length === 0) return alert("Agrega productos primero");
let niv = parseInt(document.getElementById('nivel-precio').value);
let label = document.getElementById('nivel-precio').options[niv].text;
let total = document.getElementById('total').textContent;
let ptos = document.getElementById('total-puntos').textContent;
let msg = "📋 *COTIZACIÓN*\n------------------------------\n*Nivel:* " + label + "\n\n";
carrito.forEach((p, idx) => {
msg += (idx+1) + ". " + p.n + ": *$" + p.p[niv].toFixed(2) + "*\n";
});
msg += "\n------------------------------\n✨ *Puntos Totales:* " + ptos + " pts\n🚀 *TOTAL A PAGAR: $" + total + "*\nGenerado por MultiCy 2026 🍃";
if (navigator.share) navigator.share({title: "Cotización", text: msg});
else window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
}

// Inicializar
actualizarHistorial();
actualizarTicket();
</script>

<!-- SERVICE WORKER - Detecta nuevas versiones y recarga automáticamente -->
<script>
if ('serviceWorker' in navigator) {
window.addEventListener('load', () => {
navigator.serviceWorker.register('./sw.js').then(reg => {
console.log('Service Worker registrado OK');
// Revisa si hay una actualización disponible
reg.onupdatefound = () => {
const installing = reg.installing;
installing.onstatechange = () => {
if (installing.state === 'installed' && navigator.serviceWorker.controller) {
// Hay nueva versión lista → recarga automática
alert("✅ Nueva versión cargada. Recargando...");
window.location.reload(true);
}
};
};
}).catch(err => {
console.error('Error al registrar SW:', err);
});
});
}
</script>

</body>
</html>
